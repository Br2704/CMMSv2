# ───────────────────────────────────────────────────────────────────
#  CMMS v2 — Docker Compose (Production Secure)
# ───────────────────────────────────────────────────────────────────

name: cmmsv2

x-common: &common
  restart: unless-stopped

  security_opt:
    - no-new-privileges:true

  cap_drop:
    - ALL

  cap_add:
    - NET_BIND_SERVICE

  networks:
    - app

  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: 3

  # Enable read-only rootfs for containers that support it
  # Note: postgres requires writable rootfs, so we only apply to backend + frontend
  # read_only: true (applied per-service below)

x-backend-env: &backend-env
  NODE_ENV: production

  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${DB_USER:?Set DB_USER in .env}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DB_NAME: ${DB_NAME:-postgres}
  DB_SSL: "false"

  APP_NAME: ${APP_NAME:-OptiX Maintenance Pro}
  APP_COMPANY: ${APP_COMPANY:-TamOptiX Technologies}
  APP_TAGLINE: ${APP_TAGLINE:-Powered by TamOptiX Technologies}
  APP_SHORT_NAME: ${APP_SHORT_NAME:-OptiX Maint - Pro}

  # Disable Express-level rate limiting — nginx handles it at the proxy layer
  DISABLE_RATE_LIMIT: "true"

  PORT: 3001

  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}

  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}

  # Production URLs
  CORS_ORIGINS: ${APP_CORS_ORIGINS:-https://tamoptix.tech,https://www.tamoptix.tech,https://jkf-cmms.tamoptix.tech,https://www.jkf-cmms.tamoptix.tech}
  FRONTEND_URL: ${FRONTEND_URL:-https://jkf-cmms.tamoptix.tech}

  ROOT_ADMIN_EMAIL: ${ROOT_ADMIN_EMAIL:-admin@tamoptix.tech}
  ROOT_ADMIN_PASSWORD: ${ROOT_ADMIN_PASSWORD:?Set ROOT_ADMIN_PASSWORD in .env}
  ROOT_ADMIN_FULL_NAME: ${ROOT_ADMIN_FULL_NAME:-TamOptiX Admin}

  SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@jkfenner.com}
  SUPERADMIN_FULL_NAME: ${SUPERADMIN_FULL_NAME:-JK Fenner Super Admin}

services:

  # ────────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ────────────────────────────────────────────────────────────────

  postgres:
    <<: *common

    image: postgres:16-alpine

    container_name: cmms-postgres

    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

    # PostgreSQL official image needs these capabilities to initialize
    # the data directory and switch to the postgres user
    cap_drop: []
    security_opt: []

    # Secure: accessible only inside VM
    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - cmms_postgres_data:/var/lib/postgresql/data
      - ./backups:/backups

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME:-postgres}"
        ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    stop_grace_period: 30s

  # ────────────────────────────────────────────────────────────────
  # Backend API
  # ────────────────────────────────────────────────────────────────

  backend:
    <<: *common

    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: cmms-backend

    command: >
      sh -c "
        echo '=== CMMS Backend Starting ===' &&
        echo 'Running migrations...' &&
        npm run migration:run:prod &&
        echo 'Migrations complete. Starting server...' &&
        npm run start
      "

    # Security: read-only root filesystem (needs tmpfs for /tmp + volume for uploads)
    read_only: true
    tmpfs:
      - /tmp:size=64M

    volumes:
      - cmms_uploads:/app/uploads

    stop_grace_period: 30s

    environment:
      <<: *backend-env

    # Secure: backend accessible only locally
    ports:
      - "127.0.0.1:3001:3001"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3001/health > /dev/null 2>&1 || exit 1

      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 256M

    # Security: run with lowest possible kernel capabilities
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # ────────────────────────────────────────────────────────────────
  # Frontend Application
  # ────────────────────────────────────────────────────────────────

  frontend:
    <<: *common

    build:
      context: .
      dockerfile: frontend/Dockerfile

      args:
        VITE_API_BASE_URL: /api
        VITE_APP_NAME: ${APP_NAME:-OptiX Maintenance Pro}
        VITE_APP_COMPANY: ${APP_COMPANY:-TamOptiX Technologies}
        VITE_APP_TAGLINE: ${APP_TAGLINE:-Powered by TamOptiX Technologies}
        VITE_APP_SHORT_NAME: ${APP_SHORT_NAME:-OptiX Maint - Pro}

    container_name: cmms-frontend

    # Security: read-only root filesystem
    read_only: true
    tmpfs:
      - /tmp:size=32M
      - /var/cache/nginx:size=10M
      - /var/run:size=5M
      - /var/log/nginx:size=10M

    depends_on:
      backend:
        condition: service_healthy

    # Public frontend port
    ports:
      - "8081:80"

    healthcheck:
      test:
        ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]

      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # ────────────────────────────────────────────────────────────────
  # Development Backend
  # ────────────────────────────────────────────────────────────────

  backend-dev:
    <<: *common

    profiles:
      - dev

    image: node:22-alpine

    container_name: cmms-backend-dev

    working_dir: /app

    command: >
      sh -c "
        npm install &&
        npm run migration:run &&
        npm run dev
      "

    environment:
      NODE_ENV: development

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-postgres}
      DB_SSL: "false"

      PORT: 3001

      TS_NODE_TRANSPILE_ONLY: "true"

      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-32-chars}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-dev-encryption-key-change-me-32-chars}

      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
      FRONTEND_URL: http://localhost:5173

    ports:
      - "3001:3001"

    volumes:
      - ./backend:/app
      - /app/node_modules

    depends_on:
      postgres:
        condition: service_healthy

  # ────────────────────────────────────────────────────────────────
  # Development Frontend
  # ────────────────────────────────────────────────────────────────

  frontend-dev:
    <<: *common

    profiles:
      - dev

    image: node:22-alpine

    container_name: cmms-frontend-dev

    working_dir: /app/frontend

    command: >
      sh -c "
        npm install &&
        npm run dev -- --host 0.0.0.0 --port 5173
      "

    environment:
      VITE_API_BASE_URL: http://localhost:3001/api
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules

    depends_on:
      backend-dev:
        condition: service_started

  # ────────────────────────────────────────────────────────────────
  # pgAdmin (Optional)
  # ────────────────────────────────────────────────────────────────

  pgadmin:
    <<: *common

    profiles:
      - tools

    image: dpage/pgadmin4:8

    container_name: cmms-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cmms.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}

    # Secure: localhost only
    ports:
      - "127.0.0.1:5050:80"

    depends_on:
      postgres:
        condition: service_healthy

# ────────────────────────────────────────────────────────────────
# Networks
# ────────────────────────────────────────────────────────────────

networks:
  app:
    name: cmmsv2_network
    driver: bridge

# ────────────────────────────────────────────────────────────────
# Volumes
# ────────────────────────────────────────────────────────────────

volumes:
  cmms_postgres_data:
    name: cmmsv2_postgres_data
  cmms_uploads:
    name: cmmsv2_uploads