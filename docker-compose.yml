services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cmms}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - cmms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-cmms}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - app

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    command: >
      sh -c "npm run migration:run:prod &&
             npm run seed:prod &&
             npm run start"
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cmms}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_SSL: "false"
      FRONTEND_URL: ${APP_BASE_URL:-http://192.168.31.64}
      CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://192.168.31.64,http://192.168.31.64:8080,http://localhost,http://localhost:8080,http://127.0.0.1,http://127.0.0.1:8080}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >
          require('http').get('http://127.0.0.1:3001/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - app

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  cmms_postgres_data:
