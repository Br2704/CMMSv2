# ───────────────────────────────────────────────────────────────────
#  CMMS v2 — Docker Compose (Production-ready)
#
#  Quick start:
#    1. ./scripts/docker-generate-secrets.sh   (creates .env with random secrets)
#    2. docker compose up -d
#
#  All secrets are loaded from .env — no hardcoded fallbacks.
#  If .env is missing, compose will fail with a clear error.
# ───────────────────────────────────────────────────────────────────

x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks:
    - app

x-backend-env: &backend-env
  NODE_ENV: production
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${DB_USER:?Set DB_USER in .env}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DB_SSL: "false"
  PORT: 3001
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — run ./scripts/docker-generate-secrets.sh}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env — run ./scripts/docker-generate-secrets.sh}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env — run ./scripts/docker-generate-secrets.sh}
  CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-8081},http://localhost}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-8081}}

services:
  # ─── Database ────────────────────────────────────────────────────
  postgres:
    <<: *common
    image: postgres:16-alpine
    container_name: cmms-postgres
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT_EXTERNAL:-5432}:5432"
    volumes:
      - cmms_postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ─── Backend API ─────────────────────────────────────────────────
  backend:
    <<: *common
    build:
      context: ./backend
    container_name: cmms-backend
    deploy:
      resources:
        limits:
          memory: 512M
    command: >
      sh -c "
        echo '=== CMMS Backend Starting ===' &&
        echo 'Running migrations...' &&
        npm run migration:run:prod &&
        echo 'Migrations complete. Starting server...' &&
        npm run start
      "
    stop_grace_period: 30s
    environment:
      <<: *backend-env
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >
          require('http').get('http://127.0.0.1:3001/health',
          (r) => process.exit(r.statusCode === 200 ? 0 : 1))
          .on('error', () => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ─── Frontend (Nginx + reverse proxy) ───────────────────────────
  frontend:
    <<: *common
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: cmms-frontend
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"

  # ─── Development: Backend (hot-reload) ──────────────────────────
  backend-dev:
    <<: *common
    profiles: ["dev"]
    image: node:22-alpine
    container_name: cmms-backend-dev
    working_dir: /app
    command: >
      sh -c "npm install &&
             npm run migration:run &&
             npm run dev"
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_SSL: "false"
      PORT: 3001
      TS_NODE_TRANSPILE_ONLY: "true"
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-32-chars}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-dev-encryption-key-change-me-32-chars}
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Development: Frontend (Vite dev server) ────────────────────
  frontend-dev:
    <<: *common
    profiles: ["dev"]
    image: node:22-alpine
    container_name: cmms-frontend-dev
    working_dir: /app/frontend
    command: >
      sh -c "npm install &&
             npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE_URL: http://localhost:3001/api
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      backend-dev:
        condition: service_started

  # ─── Tools: pgAdmin (optional) ──────────────────────────────────
  pgadmin:
    <<: *common
    profiles: ["tools"]
    image: dpage/pgadmin4:8
    container_name: cmms-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cmms.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

networks:
  app:
    driver: bridge

volumes:
  cmms_postgres_data:
