<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary Meta Tags --><title>%VITE_APP_NAME%</title>
    <meta name="title" content="%VITE_APP_NAME%" />
    <meta name="description" content="%VITE_APP_NAME% for asset management, work orders, preventive maintenance, and plant operations.">
    <meta name="author" content="%VITE_APP_COMPANY%" />

    <!-- PWA Meta Tags -->
    <!-- Theme color remains in public/manifest.json (theme_color) for installed PWA contexts. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%VITE_APP_NAME%" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="%VITE_APP_NAME%" />
    <meta name="msapplication-TileColor" content="#0f172a" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- iOS Splash Screens -->
    <link rel="apple-touch-startup-image" href="/splash/splash.png" />
    
    <!-- Open Graph -->
    
    
    <meta property="og:type" content="website" />
    
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/tamoptix/tamoptix-favicon.svg">
    <link rel="shortcut icon" href="/tamoptix/tamoptix-favicon.png">
    <link rel="apple-touch-icon" id="dynamic-apple-touch-icon" href="/tamoptix/tamoptix-logo.png" />
    <!-- Preconnect to fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <meta property="og:title" content="%VITE_APP_NAME%">
  <meta name="twitter:title" content="%VITE_APP_NAME%">
  <meta property="og:description" content="Enterprise-grade Computerized Maintenance Management System for industrial maintenance teams.">
  <meta name="twitter:description" content="Enterprise-grade Computerized Maintenance Management System for industrial maintenance teams.">
  <meta property="og:image" content="/tamoptix/tamoptix-logo.png">
  <meta name="twitter:image" content="/tamoptix/tamoptix-logo.png">

  <!-- Security Headers (defense-in-depth for SPA rendering contexts) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https://images.unsplash.com https://*.unsplash.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self'; connect-src 'self' ws: wss:; base-uri 'self'; form-action 'self'">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">

  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="format-detection" content="telephone=no">
</head>
  <body>
    <a href="#main-content" class="sr-only focus:not-sr-only absolute top-2 left-2 z-[1000] rounded bg-white/90 px-2 py-1 text-sm font-medium text-primary shadow">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
