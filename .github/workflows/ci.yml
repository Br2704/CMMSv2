name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: TypeScript check
        run: |
          cd frontend && npm run typecheck
          cd ../backend && npm run typecheck

      - name: Lint
        run: |
          cd frontend && npm run lint
          cd ../backend && npm run lint

      - name: Frontend build
        run: npm run build
        working-directory: frontend

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Backend security audit
        run: npm audit --audit-level=high
        working-directory: backend
        continue-on-error: true

      - name: Frontend security audit
        run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true

      - name: Run dependency security scanner (Snyk)
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          working-directory: backend

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM (backend)
        run: npx @cyclonedx/cyclonedx-npm --output-file backend-sbom.json
        working-directory: backend
        continue-on-error: true

      - name: Generate SBOM (frontend)
        run: npx @cyclonedx/cyclonedx-npm --output-file frontend-sbom.json
        working-directory: frontend
        continue-on-error: true

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            backend/backend-sbom.json
            frontend/frontend-sbom.json

  docker:
    name: Docker Build + Image Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t cmms-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t cmms-frontend:ci -f frontend/Dockerfile .

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: 'cmms-backend:ci'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: 'cmms-frontend:ci'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Smoke test with compose
        run: |
          docker compose up -d postgres
          sleep 5
          docker compose run --rm backend npm run test:smoke
        env:
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: postgres
          JWT_SECRET: test-jwt-secret-32-chars-minimum!!
          JWT_REFRESH_SECRET: test-refresh-secret-32-chars-min!!
          DATA_ENCRYPTION_KEY: test-encryption-key-32-chars-min!
